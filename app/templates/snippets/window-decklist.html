<div class="window decklist-window">
    <div class="title-bar">
        <span>Deck Print</span>
    </div>

    <main class="panel decklist-panel">
        <div id="decklistInputSection">
            <textarea id="decklistTextarea" class="decklist-textarea" placeholder="Paste decklist here...

Deck
4 Counterspell
4 Opt
17 Island

Sideboard
3 Annul">
    </textarea>
            <button id="decklistPreviewBtn" class="action-btn primary">Preview</button>
            <div id="decklistInputError" class="error-message" style="display: none;"></div>
        </div>

        <div id="decklistPreviewSection" style="display: none;">
            <div class="card-actions">
                <button id="decklistPrintBtn" class="action-btn primary">Print All</button>
                <button id="decklistBackBtn" class="action-btn">Back</button>
            </div>
            <div id="decklistStatus" class="decklist-status"></div>
            <div id="decklistCards" class="decklist-cards"></div>
        </div>

        <div id="decklistLoadingState" class="panel loading-state" style="display: none;">
            <p>Loading...</p>
        </div>
    </main>
</div>
