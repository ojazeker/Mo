<div class="window top8-window">
    <div class="title-bar">
        <span>Top 8 Decks</span>
    </div>

    <div class="panel top8-panel">
        <div class="top8-controls">
            <select id="top8FormatSelect" class="top8-select">
                <option value="premodern" selected>Premodern</option>
                <option value="modern">Modern</option>
                <option value="pauper">Pauper</option>
                <option value="standard">Standard</option>
            </select>
        </div>

        <div id="top8DeckList" class="top8-deck-list">
            <p class="top8-empty">Loading decks&hellip;</p>
        </div>

        <div id="top8Error" class="error-message" style="display: none;"></div>
    </div>
</div>
